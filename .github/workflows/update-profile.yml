# Adapted from Giorgi Kobaidze's MIT-licensed update-profile workflow
# (https://github.com/georgekobaidze/georgekobaidze).
name: Update profile

on:
  schedule:
    - cron: "17 6 * * *"              # daily at 06:17 …
      timezone: "America/Sao_Paulo"   # … São Paulo time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/profile/*.py"
      - "tools/profile/projects.json"
      - "tools/profile/accounts.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch data
        env:
          PROFILE_ACCOUNTS: "Goblinpaul=PROFILE_TOKEN_GOBLINPAUL,pplintracking=PROFILE_TOKEN_A,aipecorp=PROFILE_TOKEN_B"
          PROFILE_TOKEN_GOBLINPAUL: ${{ secrets.PROFILE_TOKEN_GOBLINPAUL }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional alias for Goblinpaul
          PROFILE_TOKEN_A: ${{ secrets.PPLINTRACKING }}
          PROFILE_TOKEN_B: ${{ secrets.AIPECORP }}
          GITHUB_TOKEN: ${{ github.token }}             # public GraphQL fallback
        run: python tools/profile/fetch.py

      - name: Render SVGs
        run: python tools/profile/render.py

      - name: Update README
        run: python tools/profile/readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/profile/data assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile stats"
            git push
          fi
