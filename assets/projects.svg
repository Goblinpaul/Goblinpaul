<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="100" viewBox="0 0 800 100"
     role="img" aria-label="Projects">
  <title>projects</title>
  <desc>Projects</desc>
  <defs>
    <clipPath id="term">
      <rect x="1" y="1" width="798" height="98" rx="10" ry="10"/>
    </clipPath>
    <style type="text/css"><![CDATA[
text, .prompt, .label, .value, .dim, .chrome-title {
      font-family: "Courier New", Courier, ui-monospace, "Liberation Mono", monospace;
    }
    .chrome-title {
      fill: #2a8a2a;
      font-size: 11px;
    }
    .prompt {
      fill: #39ff14;
      font-size: 13px;
    }
    .label {
      fill: #2a8a2a;
      font-size: 11px;
    }
    .value {
      fill: #39ff14;
      font-size: 28px;
    }
    .sub {
      fill: #2a8a2a;
      font-size: 12px;
    }
    .fg {
      fill: #39ff14;
      font-size: 13px;
    }
    .muted {
      fill: #2a8a2a;
      font-size: 12px;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
    .ln { animation: fadein .35s ease-out both; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    ]]></style>
    
  </defs>
  <rect x="0" y="0" width="800" height="100" rx="10" ry="10"
        fill="#020400" stroke="#1a5a1a" stroke-width="1.5"/>
  <g clip-path="url(#term)">
    <rect x="0" y="0" width="800" height="28" fill="#0a1c0a"/>
    <line x1="0" y1="28" x2="800" y2="28" stroke="#1a5a1a" stroke-width="1"/>
    <circle cx="18" cy="14.0" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="14.0" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="14.0" r="5" fill="#27c93f"/>
    <text class="chrome-title" x="400.0" y="15.0"
          text-anchor="middle" dominant-baseline="middle">projects</text>
<text class="prompt" x="20" y="44" text-anchor="start" dominant-baseline="middle">$ ls -l ~/projects</text>
<rect class="cursor" x="164.4" y="41.24" width="6.50" height="7.43" fill="#39ff14"/><text class="muted" x="20" y="72" text-anchor="start" dominant-baseline="middle"># no projects listed yet</text>  </g>
</svg>
